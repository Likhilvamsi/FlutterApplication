name: Build and Deploy Flutter (Web + APK)

on:
  push:
    branches:
      - main

jobs:
  # Deploy Flutter web to VM
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter web
        run: flutter build web --release

      - name: Remove old frontend files on VM
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: azureuser
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo rm -rf /home/azureuser/app/frontend/*

      - name: Upload web build to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: azureuser
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: build/web/*
          target: /home/azureuser/app/frontend/
          overwrite: true

      - name: Restart nginx
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: azureuser
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo systemctl restart nginx

  # Build APK, upload to Azure Blob, and delete old blobs
  build-apk:
    runs-on: ubuntu-latest
    needs: deploy
    env:
      STORAGE_NAME: flutterapplication
      STORAGE_CONTAINER: application
      AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flutter-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Ensure Azure CLI is available
        run: az --version

      - name: Create container if not exists
        run: |
          az storage container create \
            --account-name "$STORAGE_NAME" \
            --name "$STORAGE_CONTAINER" \
            --auth-mode key \
            --account-key "$AZURE_STORAGE_KEY" \
            --output none || true

      - name: Upload APK to Azure Blob
        run: |
          VERSION=$(date +'%Y.%m.%d-%H%M')
          FILE_NAME="barber_app-${VERSION}.apk"
          az storage blob upload \
            --account-name "$STORAGE_NAME" \
            --container-name "$STORAGE_CONTAINER" \
            --name "$FILE_NAME" \
            --file build/app/outputs/flutter-apk/app-release.apk \
            --auth-mode key \
            --account-key "$AZURE_STORAGE_KEY"
          echo "DOWNLOAD_URL=https://$STORAGE_NAME.blob.core.windows.net/$STORAGE_CONTAINER/$FILE_NAME" >> $GITHUB_ENV

      - name: Print download URL
        run: echo "APK available at: ${{ env.DOWNLOAD_URL }}"

      - name: Cleanup - delete blobs older than 7 days
        run: |
          # create a small script to list and delete old blobs
          cat > cleanup_old_blobs.py <<'PY'
import os
import subprocess
import json
from datetime import datetime, timezone, timedelta

storage_name = os.environ['STORAGE_NAME']
container = os.environ['STORAGE_CONTAINER']
key = os.environ['AZURE_STORAGE_KEY']

# list blobs as JSON
cmd = [
  "az", "storage", "blob", "list",
  "--account-name", storage_name,
  "--container-name", container,
  "--auth-mode", "key",
  "--account-key", key,
  "-o", "json"
]
proc = subprocess.run(cmd, capture_output=True, text=True)
if proc.returncode != 0:
    print("Failed to list blobs:", proc.stderr)
    exit(0)

blobs = json.loads(proc.stdout)
cutoff = datetime.now(timezone.utc) - timedelta(days=7)

for b in blobs:
    name = b.get("name")
    props = b.get("properties", {})
    lm = props.get("lastModified")
    if not lm or not name:
        continue
    # Azure returns e.g. '2025-11-10T12:34:56+00:00'
    try:
        lastmod = datetime.fromisoformat(lm.replace("Z", "+00:00"))
    except Exception:
        continue
    if lastmod < cutoff:
        print("Deleting:", name)
        del_cmd = [
          "az", "storage", "blob", "delete",
          "--account-name", storage_name,
          "--container-name", container,
          "--name", name,
          "--auth-mode", "key",
          "--account-key", key
        ]
        subprocess.run(del_cmd)
print("Cleanup done.")
PY
          python3 cleanup_old_blobs.py

