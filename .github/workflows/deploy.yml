name: Build and Deploy Flutter (Web + APK)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release

      - name: Clean old frontend files in VM
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: azureuser
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo rm -rf /home/azureuser/app/frontend/*

      - name: Upload web build to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: azureuser
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: build/web/*
          target: /home/azureuser/app/frontend/
          overwrite: true

      - name: Restart Nginx
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: azureuser
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo systemctl restart nginx
            echo "Web deployed successfully"

  build-apk:
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flutter-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK to Azure Blob Storage
        uses: azure/CLI@v2
        env:
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
        with:
          inlineScript: |
            echo "Starting APK upload to Azure Blob Storage..."

            VERSION=$(date +'%Y.%m.%d-%H%M')
            FILE_NAME="barber_app-${VERSION}.apk"

            az storage container create \
              --account-name flutterapplication \
              --name application \
              --auth-mode key \
              --account-key "$AZURE_STORAGE_KEY" \
              --output none || true

            az storage blob upload \
              --account-name flutterapplication \
              --container-name application \
              --name "$FILE_NAME" \
              --file build/app/outputs/flutter-apk/app-release.apk \
              --auth-mode key \
              --account-key "$AZURE_STORAGE_KEY"

            DOWNLOAD_URL="https://flutterapplication.blob.core.windows.net/application/$FILE_NAME"
            echo "DOWNLOAD_URL=$DOWNLOAD_URL" >> $GITHUB_ENV

      - name: Print Download URL
        run: echo "APK available at: ${{ env.DOWNLOAD_URL }}"

      - name: Delete old APKs from Azure Blob Storage (older than 7 days)
        uses: azure/CLI@v2
        env:
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
        with:
          inlineScript: |
            echo "Cleaning APKs older than 7 days..."

            # compute cutoff in RFC3339-ish format used by Azure (UTC)
            SEVEN_DAYS_AGO=$(date -u -d '7 days ago' +'%Y-%m-%dT%H:%MZ')

            # list blobs and filter by lastModified < cutoff, then delete them
            az storage blob list \
              --account-name flutterapplication \
              --container-name application \
              --auth-mode key \
              --account-key "$AZURE_STORAGE_KEY" \
              --query "[?properties.lastModified<'$SEVEN_DAYS_AGO'].{name:name, lastModified:properties.lastModified}" \
              -o tsv | awk '{print $1}' | while read -r BLOB_NAME; do
                if [ -n "$BLOB_NAME" ]; then
                  echo "Deleting blob: $BLOB_NAME"
                  az storage blob delete \
                    --account-name flutterapplication \
                    --container-name application \
                    --name "$BLOB_NAME" \
                    --auth-mode key \
                    --account-key "$AZURE_STORAGE_KEY"
                fi
              done

            echo "Cleanup finished."
