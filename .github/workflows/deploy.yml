name: Build and Deploy Flutter (Web + APK)

on:
  push:
    branches:
      - main

jobs:
  # =========================================================
  # 🌐 DEPLOY FLUTTER WEB TO AZURE VM
  # =========================================================
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release

      - name: Clean old frontend files in VM
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: azureuser
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo rm -rf /home/azureuser/app/frontend/*

      - name: Upload web build to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: azureuser
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: build/web/*
          target: /home/azureuser/app/frontend/
          overwrite: true

      - name: Restart Nginx
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: azureuser
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo systemctl restart nginx
            echo "Web deployed successfully"


  # =========================================================
  # 📱 BUILD & UPLOAD ANDROID APK
  # =========================================================
  build-apk:
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flutter-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK to Azure Blob Storage
        uses: azure/CLI@v2
        with:
          inlineScript: |
            echo "Starting APK Upload..."

            VERSION=$(date +'%Y.%m.%d-%H%M')
            FILE_NAME="barber_app-${VERSION}.apk"

            az storage container create \
              --account-name flutterapplication \
              --name application \
              --auth-mode key \
              --account-key ${{ secrets.AZURE_STORAGE_KEY }}

            az storage blob upload \
              --account-name flutterapplication \
              --container-name application \
              --name $FILE_NAME \
              --file build/app/outputs/flutter-apk/app-release.apk \
              --auth-mode key \
              --account-key ${{ secrets.AZURE_STORAGE_KEY }}

            DOWNLOAD_URL="https://flutterapplication.blob.core.windows.net/application/$FILE_NAME"
            echo "DOWNLOAD_URL=$DOWNLOAD_URL" >> $GITHUB_ENV

      - name: Print Download URL
        run: echo "APK available at: ${{ env.DOWNLOAD_URL }}"

      # =========================================================
      # 🧹 AUTO DELETE OLD APKS (OLDER THAN 7 DAYS)
      # =========================================================
      - name: Delete old APKs from Azure Blob Storage
        uses: azure/CLI@v2
        with:
          inlineScript: |
            echo "Deleting old APKs older than 7 days..."

            SEVEN_DAYS_AGO=$(date -d "-7 days" +"%Y-%m-%dT%H:%MZ")

            az storage blob list \
              --account-name flutterapplication \
              --container-name application \
              --auth-mode key \
              --account-key ${{ secrets.AZURE_STORAGE_KEY }} \
              --query "[?properties.lastModified<'$SEVEN_DAYS_AGO'].[name]" \
              -o tsv | while read BLOB_NAME; do
                if [ ! -z "$BLOB_NAME" ]; then
                  echo "Deleting: $BLOB_NAME"
                  az storage blob delete \
                    --account-name flutterapplication \
                    --container-name application \
                    --name "$BLOB_NAME" \
                    --auth-mode key \
                    --account-key ${{ secrets.AZURE_STORAGE_KEY }}
                fi
              done

            echo "Cleanup Completed!"
