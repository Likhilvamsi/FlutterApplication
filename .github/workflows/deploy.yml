name: Build and Deploy Flutter (Web + APK)

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"

      - run: flutter pub get
      - run: flutter build web --release

      - uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: azureuser
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: sudo rm -rf /home/azureuser/app/frontend/*

      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: azureuser
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: build/web/*
          target: /home/azureuser/app/frontend/
          overwrite: true

      - uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: azureuser
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: sudo systemctl restart nginx

  build-apk:
    runs-on: ubuntu-latest
    needs: deploy
    env:
      STORAGE_NAME: flutterapplication
      CONTAINER_NAME: application
      AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"

      - run: flutter pub get
      - run: flutter build apk --release --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: Flutter-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - run: az storage container create --account-name "$STORAGE_NAME" --name "$CONTAINER_NAME" --auth-mode key --account-key "$AZURE_STORAGE_KEY" --output none || true

      - run: VERSION=$(date +'%Y.%m.%d-%H%M');FILE_NAME="barber_app-$VERSION.apk";az storage blob upload --account-name "$STORAGE_NAME" --container-name "$CONTAINER_NAME" --name "$FILE_NAME" --file build/app/outputs/flutter-apk/app-release.apk --auth-mode key --account-key "$AZURE_STORAGE_KEY";echo "DOWNLOAD_URL=https://$STORAGE_NAME.blob.core.windows.net/$CONTAINER_NAME/$FILE_NAME" >> $GITHUB_ENV

      - run: echo "APK available at: ${{ env.DOWNLOAD_URL }}"
