name: Build and Deploy Flutter (Web + APK)

on:
  push:
    branches:
      - main

jobs:

  # =========================================================
  # 🌐 DEPLOY FLUTTER WEB TO AZURE VM
  # =========================================================
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release

      - name: Clean old frontend files in VM
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: azureuser
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo rm -rf /home/azureuser/app/frontend/*

      - name: Upload web build to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: azureuser
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: build/web/*
          target: /home/azureuser/app/frontend/
          overwrite: true

      - name: Restart Nginx
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: azureuser
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo systemctl restart nginx



  # =========================================================
  # 📱 BUILD APK + UPLOAD + CLEAN OLD FILES
  # =========================================================
  build-apk:
    runs-on: ubuntu-latest
    needs: deploy

    env:
      STORAGE_NAME: flutterapplication
      STORAGE_CONTAINER: application
      STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flutter-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      # ---------------------
      # Upload APK to Azure
      # ---------------------
      - name: Create Storage Container (safe)
        run: |
          az storage container create \
            --account-name "$STORAGE_NAME" \
            --name "$STORAGE_CONTAINER" \
            --auth-mode key \
            --account-key "$STORAGE_KEY" \
            --output none || true

      - name: Upload APK to Azure Blob
        run: |
          VERSION=$(date +'%Y.%m.%d-%H%M')
          FILE_NAME="barber_app-${VERSION}.apk"

          az storage blob upload \
            --account-name "$STORAGE_NAME" \
            --container-name "$STORAGE_CONTAINER" \
            --name "$FILE_NAME" \
            --file build/app/outputs/flutter-apk/app-release.apk \
            --auth-mode key \
            --account-key "$STORAGE_KEY"

          echo "DOWNLOAD_URL=https://$STORAGE_NAME.blob.core.windows.net/$STORAGE_CONTAINER/$FILE_NAME" >> $GITHUB_ENV

      - name: Print Download URL
        run: echo "APK available at: ${{ env.DOWNLOAD_URL }}"

      # ---------------------
      # DELETE OLD APKs (7 days)
      # ---------------------
      - name: Delete APKs older than 7 days
        run: |
          SEVEN_DAYS_AGO=$(date -u -d '7 days ago' +'%Y-%m-%dT%H:%MZ')

          az storage blob list \
            --account-name "$STORAGE_NAME" \
            --container-name "$STORAGE_CONTAINER" \
            --auth-mode key \
            --account-key "$STORAGE_KEY" \
            --query "[?properties.lastModified<'$SEVEN_DAYS_AGO'].[name]" \
            -o tsv | while read BLOB_NAME; do
              if [ -n "$BLOB_NAME" ]; then
                echo "Deleting $BLOB_NAME"
                az storage blob delete \
                  --account-name "$STORAGE_NAME" \
                  --container-name "$STORAGE_CONTAINER" \
                  --name "$BLOB_NAME" \
                  --auth-mode key \
                  --account-key "$STORAGE_KEY"
              fi
            done

