name: Deploy Frontend

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release

      # Upload built Flutter web app to server
      - name: Upload Frontend to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "build/web/**"
          target: "/home/${{ secrets.SSH_USER }}/app/frontend/"
          overwrite: true
          strip_components: 2

      # Install & configure NGINX to serve Flutter web + proxy /api to backend
      - name: Configure NGINX Automatically
        uses: appleboy/ssh-action@v1.0.1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Installing NGINX..."
            sudo apt update -y
            sudo apt install -y nginx

            echo "Configuring NGINX..."
            sudo tee /etc/nginx/sites-available/default > /dev/null << 'EOF'
            server {
                listen 80;
                server_name _;

                root /home/${SSH_USER}/app/frontend;
                index index.html;

                location / {
                    try_files $uri $uri/ /index.html;
                }

                # Proxy for FastAPI backend
                location /api/ {
                    proxy_pass http://127.0.0.1:8000/;
                }
            }
            EOF

            # Replace placeholder with real user
            sudo sed -i "s/\${SSH_USER}/${USER}/g" /etc/nginx/sites-available/default

            echo "Testing and restarting NGINX..."
            sudo nginx -t
            sudo systemctl restart nginx
            sudo systemctl enable nginx
