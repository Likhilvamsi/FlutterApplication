name: Build and Upload Flutter APK to Azure Blob

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Install correct Flutter SDK (required by your project)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.1"   # REQUIRED for SDK ^3.8.1

      # Get dependencies
      - name: Install dependencies
        run: flutter pub get

      # Build release APK
      - name: Build release APK
        run: flutter build apk --release

      # Upload APK as artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # Install Azure CLI
      - name: Install Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      # Upload APK to Azure Blob Storage
      - name: Upload APK to Azure Blob Storage
        uses: azure/CLI@v2
        with:
          inlineScript: |
            STORAGE_ACCOUNT="flutterapplication"
            CONTAINER_NAME="application"
            APK_FILE="build/app/outputs/flutter-apk/app-release.apk"
            BLOB_NAME="app-release-$(date +'%Y-%m-%d_%H-%M-%S').apk"

            echo "📁 Checking if container exists..."
            az storage container create \
              --account-name $STORAGE_ACCOUNT \
              --name $CONTAINER_NAME \
              --auth-mode key \
              --account-key "${{ secrets.AZURE_STORAGE_KEY }}" \
              --public-access blob

            echo "⬆ Uploading APK to Azure Blob..."
            az storage blob upload \
              --account-name $STORAGE_ACCOUNT \
              --container-name $CONTAINER_NAME \
              --name $BLOB_NAME \
              --file $APK_FILE \
              --auth-mode key \
              --account-key "${{ secrets.AZURE_STORAGE_KEY }}" \
              --overwrite

            echo "✅ Upload Success!"
            echo "🌍 APK URL:"
            echo "https://$STORAGE_ACCOUNT.blob.core.windows.net/$CONTAINER_NAME/$BLOB_NAME"
