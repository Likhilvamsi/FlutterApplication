name: Build and Upload Flutter APK to Azure Blob

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up JDK (required for Flutter Android build)
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"

      # Step 3: Set up Flutter SDK
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.4"

      # Step 4: Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # Step 5: Build APK
      - name: Build release APK
        run: flutter build apk --release

      # Step 6: Upload APK as GitHub artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # Step 7: Install Azure CLI
      - name: Install Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      # Step 8: Upload APK to Azure Blob Storage
      - name: Upload APK to Azure Blob Storage
        env:
          STORAGE_ACCOUNT: flutterapplication
          CONTAINER_NAME: application
          ACCOUNT_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
        run: |
          APK_FILE="build/app/outputs/flutter-apk/app-release.apk"
          BLOB_NAME="app-release-$(date +'%Y-%m-%d_%H-%M-%S').apk"

          echo "Creating container if not exists..."
          az storage container create \
            --name $CONTAINER_NAME \
            --account-name $STORAGE_ACCOUNT \
            --account-key $ACCOUNT_KEY \
            --public-access blob

          echo "Uploading APK..."
          az storage blob upload \
            --account-name $STORAGE_ACCOUNT \
            --container-name $CONTAINER_NAME \
            --name $BLOB_NAME \
            --file $APK_FILE \
            --account-key $ACCOUNT_KEY \
            --overwrite

          echo "Upload completed successfully!"
          echo "Public APK URL:"
          echo "https://$STORAGE_ACCOUNT.blob.core.windows.net/$CONTAINER_NAME/$BLOB_NAME"
