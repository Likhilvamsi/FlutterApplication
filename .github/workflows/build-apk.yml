name: Build and Upload Flutter APK to Azure Blob

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install correct Flutter version (3.38.1 = Dart 3.8.1)
      - name: Set up Flutter 3.38.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: 'stable'

      # Step 3: Verify Flutter installation
      - name: Flutter doctor
        run: flutter doctor -v

      # Step 4: Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # Step 5: Build release APK
      - name: Build release APK
        run: flutter build apk --release

      # Step 6: Upload APK to GitHub artifacts
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # Step 7: Install Azure CLI
      - name: Install Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      # Step 8: Upload APK to Azure Blob Storage
      - name: Upload APK to Azure Blob Storage
        uses: azure/CLI@v2
        with:
          inlineScript: |
            STORAGE_ACCOUNT="flutterapplication"
            CONTAINER_NAME="application"
            APK_FILE="build/app/outputs/flutter-apk/app-release.apk"
            BLOB_NAME="app-release-$(date +'%Y-%m-%d_%H-%M-%S').apk"

            echo "🔹 Ensure container exists"
            az storage container create \
              --account-name $STORAGE_ACCOUNT \
              --name $CONTAINER_NAME \
              --account-key "${{ secrets.AZURE_STORAGE_KEY }}" \
              --auth-mode key \
              --public-access blob

            echo "🔹 Uploading APK..."
            az storage blob upload \
              --account-name $STORAGE_ACCOUNT \
              --container-name $CONTAINER_NAME \
              --name $BLOB_NAME \
              --file $APK_FILE \
              --account-key "${{ secrets.AZURE_STORAGE_KEY }}" \
              --auth-mode key \
              --overwrite

            echo "✅ Upload successful!"
            echo "🌐 Download URL:"
            echo "https://$STORAGE_ACCOUNT.blob.core.windows.net/$CONTAINER_NAME/$BLOB_NAME"
